name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    name: Update Formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          TAG: ${{ github.event.client_payload.tag }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA256_ARM: ${{ github.event.client_payload.sha256_arm }}
          SHA256_X86: ${{ github.event.client_payload.sha256_x86 }}
        run: |
          R2_BASE="https://updates.writerslogic.com/cli"
          sed -i \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s|url \".*writersproof-cli-v[^-]*-aarch64-apple-darwin\.tar\.gz\"|url \"${R2_BASE}/writersproof-cli-${TAG}-aarch64-apple-darwin.tar.gz\"|" \
            -e "s|url \".*writersproof-cli-v[^-]*-x86_64-apple-darwin\.tar\.gz\"|url \"${R2_BASE}/writersproof-cli-${TAG}-x86_64-apple-darwin.tar.gz\"|" \
            Formula/writersproof.rb
          # Update ARM sha256 (first occurrence)
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"${SHA256_ARM}\"/" Formula/writersproof.rb
          # Update x86 sha256 (second occurrence)
          awk -v hash="${SHA256_X86}" '/sha256 "[a-f0-9]{64}"/{c++;if(c==2){sub(/sha256 "[a-f0-9]{64}"/,"sha256 \""hash"\"")}}1' Formula/writersproof.rb > /tmp/formula.rb && mv /tmp/formula.rb Formula/writersproof.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/writersproof.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update writersproof-cli to ${{ github.event.client_payload.version }}"
          git push
