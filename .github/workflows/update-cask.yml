name: Update Cask

on:
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update:
    name: Update Cask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          # The cask's url interpolates #{version}, so only version and sha256
          # change. Both are asserted below rather than trusted, because a bad
          # dispatch payload would otherwise publish a cask that resolves to a
          # DMG that does not exist.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::bad version: $VERSION"; exit 1; }
          [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]] \
            || { echo "::error::bad sha256: $SHA256"; exit 1; }

          sed -i \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"${SHA256}\"/" \
            Casks/writersproof.rb

          grep -q "version \"${VERSION}\"" Casks/writersproof.rb || { echo "::error::version not applied"; exit 1; }
          grep -q "sha256 \"${SHA256}\"" Casks/writersproof.rb || { echo "::error::sha256 not applied"; exit 1; }

      - name: Verify the published DMG matches the hash
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          # A cask whose sha256 does not match the live DMG fails for every user
          # at install time with a checksum error. Catch it here instead.
          URL="https://updates.writerslogic.com/WritersProof-${VERSION}.dmg"
          curl --fail --silent --show-error --location -o /tmp/live.dmg "$URL"
          ACTUAL="$(sha256sum /tmp/live.dmg | awk '{print $1}')"
          [[ "$ACTUAL" == "$SHA256" ]] \
            || { echo "::error::$URL hashes to $ACTUAL, dispatch said $SHA256"; exit 1; }
          echo "verified $URL -> $ACTUAL"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/writersproof.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update writersproof cask to ${{ github.event.client_payload.version }}"
          git push
